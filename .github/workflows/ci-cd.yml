
name: CI/CD

# Chay tren moi push + Pull Request vao main.
# CD (push Docker image len GHCR) chi chay khi push thang vao main va CI xanh het.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Huy luot chay cu khi co commit moi tren cung nhanh/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mac dinh chi doc; job nao can ghi se khai bao rieng
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ndtnht/ccmtpt

jobs:
  # ================= CI 1: Backend Java 17 / Spring Boot =================
  backend:
    name: Backend — Maven build + test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin) + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # pom.xml da khai bao sourceDirectory = dependencies/src/main/java
      # va testSourceDirectory = dependencies/src/test/java nen chi can chay o root.
      # `verify` = compile + chay JUnit 5 / spring-boot-starter-test + dong goi jar.
      - name: Build va chay test
        run: mvn -B -ntp verify

      - name: Luu bao cao test (ke ca khi pass, de doi chieu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Luu file jar da build
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/task-management-system-1.0.0.jar
          retention-days: 7

  # ================= CI 2: WebUI Vue 3 + Vite =================
  webui:
    name: WebUI — Vite build (Vue 3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Cai dependencies dung lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Luu ban build webui
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          retention-days: 7

  # ================= CI 3: Docker image + smoke test =================
  docker:
    name: Docker — build image + smoke test /actuator/health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load ve may de chay thu, chua push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ccmtpt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dockerfile da co HEALTHCHECK goi /actuator/health — chay that de xac nhan
      - name: Smoke test — chay container va doi health len 200
        run: |
          docker run -d --name app -p 8080:8080 ccmtpt:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              echo "Health OK sau $((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Health khong len sau 150s — log container:"
          docker logs app
          exit 1

      - name: Dung container
        if: always()
        run: docker rm -f app || true

  # ================= CD: day image len GHCR =================
  publish:
    name: CD — push image len GHCR (chi nhanh main)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, webui, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR bang GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tags chuan (latest + sha + version 1.0.0)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.0
            type=sha,format=long

      - name: Build va push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
