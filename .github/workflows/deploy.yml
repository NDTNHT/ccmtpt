name: CI/CD Pipeline & Delivery Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Clean Architecture Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute 153 Domain & Adapter Unit Tests
        run: mvn clean test

  frontend-build:
    name: Frontend Vue 3 TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: webui
        run: npm ci

      - name: Compile TypeScript & Build Production SPA Bundle
        working-directory: webui
        run: npm run build

      - name: Upload Production WebUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-webui-dist
          path: webui/dist/
