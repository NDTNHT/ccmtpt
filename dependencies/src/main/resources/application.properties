spring.application.name=task-management-system

server.port=${PORT:${SERVER_PORT:8088}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

taskmanagement.db=${TASKMANAGEMENT_DB:data/tasks.db}
api.key=${API_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# AI Assistant Configuration
ai.enabled=${AI_ENABLED:true}
# Provider options: openai | anthropic | gemini | custom | heuristic
ai.provider=${AI_PROVIDER:openai}
ai.auto-enrich-on-create=${AI_AUTO_ENRICH_ON_CREATE:false}
ai.default-system-prompt=${AI_SYSTEM_PROMPT:You are an expert AI task management assistant. Analyze tasks, decompose them into actionable subtasks, estimate realistic completion deadlines, evaluate priorities, and produce clear summaries. Always output strictly valid JSON matching the requested structure.}

# OpenAI-Compatible Provider (OpenAI, OpenRouter, DeepSeek, Groq, Ollama)
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}

# Google Gemini Native REST Provider
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

# Anthropic-Compatible Messages Provider (Claude 3.5 Sonnet, Claude 3 Haiku)
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
ai.anthropic.model=${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
ai.anthropic.version=${ANTHROPIC_VERSION:2023-06-01}
ai.anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:4096}
ai.anthropic.timeout-seconds=${ANTHROPIC_TIMEOUT_SECONDS:30}

# Custom Self-Integrated Provider (OpenAI or Anthropic wire format)
# Format options: openai | anthropic
ai.custom.format=${AI_CUSTOM_FORMAT:openai}
ai.custom.base-url=${AI_CUSTOM_BASE_URL:}
ai.custom.api-key=${AI_CUSTOM_API_KEY:}
ai.custom.model=${AI_CUSTOM_MODEL:}
ai.custom.timeout-seconds=${AI_CUSTOM_TIMEOUT_SECONDS:30}
ai.custom.max-tokens=${AI_CUSTOM_MAX_TOKENS:4096}
