spring.application.name=task-management-system

server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

taskmanagement.db=${TASKMANAGEMENT_DB:data/tasks.db}
api.key=${API_KEY:}

# AI Assistant configuration
ai.enabled=${AI_ENABLED:true}
ai.provider=${AI_PROVIDER:auto}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.temperature=${AI_TEMPERATURE:0.3}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
ai.system-prompt=${AI_SYSTEM_PROMPT:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
