services:
  app:
    build: .
    image: task-management-system:1.0.0
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      TASKMANAGEMENT_DB: /app/data/tasks.db
      API_KEY: ${API_KEY:-}
    volumes:
      - task-data:/app/data
    restart: unless-stopped

volumes:
  task-data:
